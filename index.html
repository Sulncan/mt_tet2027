<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tết 2027 KAM Portal</title>
<style>
:root{
  color-scheme:light;
  --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f7f9fb; --line:#e3e8ee; --line-strong:#cfd7e1;
  --text:#16202b; --text-2:#4d5b6a; --text-3:#7d8a98;
  --brand:#1f3a5f; --brand-ink:#ffffff;
  --s-plan:#9fb4cc; --s-order:#2a78d6; --s-deli:#1baf7a; --s-y26:#eb6834;
  --good:#1f7a3f; --good-bg:#e3f3e8; --warn:#8a5a00; --warn-bg:#fff2cc; --bad:#a3271f; --bad-bg:#fbe3e1; --info-bg:#eaf1fb;
  --shadow:0 1px 2px rgba(16,32,48,.06),0 4px 16px rgba(16,32,48,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111418; --surface:#1a1e24; --surface-2:#20262d; --line:#2b323b; --line-strong:#3a434e;
    --text:#eef1f4; --text-2:#b6c0ca; --text-3:#8692a0;
    --brand:#9fc0ea; --brand-ink:#0d1520;
    --s-plan:#5d7088; --s-order:#3987e5; --s-deli:#199e70; --s-y26:#d95926;
    --good:#7fd39a; --good-bg:#1d3326; --warn:#f0c868; --warn-bg:#3a2f12; --bad:#f19a92; --bad-bg:#3d1f1d; --info-bg:#1d2a3b;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111418; --surface:#1a1e24; --surface-2:#20262d; --line:#2b323b; --line-strong:#3a434e;
  --text:#eef1f4; --text-2:#b6c0ca; --text-3:#8692a0;
  --brand:#9fc0ea; --brand-ink:#0d1520;
  --s-plan:#5d7088; --s-order:#3987e5; --s-deli:#199e70; --s-y26:#d95926;
  --good:#7fd39a; --good-bg:#1d3326; --warn:#f0c868; --warn-bg:#3a2f12; --bad:#f19a92; --bad-bg:#3d1f1d; --info-bg:#1d2a3b;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px}
.titlebar{display:flex;align-items:center;gap:12px;padding:12px 0 8px;flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700}
h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.meta{color:var(--text-3);font-size:12px}
.spacer{flex:1}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.filters{display:flex;gap:10px;flex-wrap:wrap;padding:6px 0 12px;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:3px;min-width:120px}
.f label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
select,input[type=date]{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;min-height:34px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);color:var(--text-2);padding:7px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--brand);color:var(--brand-ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{border:0;background:none;color:var(--text-2);padding:10px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--brand);font-weight:600}
main{padding:16px 0 40px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.kpi .lab{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--text-2);margin-top:2px}
.card h2{font-size:14px;margin:0 0 10px;font-weight:650}
.card h2 .hint{font-weight:400;color:var(--text-3);font-size:12px;margin-left:6px}
.two{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:2px;border-radius:0;width:14px;vertical-align:3px;border-top:2px dashed var(--s-y26);background:none}
svg text{fill:var(--text-3);font-size:11px}
.tbl{overflow:auto;max-height:620px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:600;z-index:1;cursor:pointer;user-select:none}
th.l,td.l{text-align:left}
td.wrap{white-space:normal;min-width:220px;max-width:340px;text-align:left;color:var(--text-2);font-size:12px}
tr:hover td{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--surface-2);color:var(--text-3)}
.pct.lo{color:var(--bad);font-weight:600} .pct.hi{color:var(--warn);font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--s-plan)}
.bar.d{background:var(--s-deli)}
.muted{color:var(--text-3)}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:50;display:none;min-width:150px}
.tip b{display:block;margin-bottom:4px}
.tip .row{display:flex;justify-content:space-between;gap:16px}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.arch{line-height:1.6;color:var(--text-2)}
.arch code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:12px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:12px 0}
.flow div{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2)}
.flow b{display:block;color:var(--text);margin-bottom:2px}
.err{max-width:640px;margin:80px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="titlebar">
      <div class="logo">T</div>
      <div>
        <h1>Tết 2027 – MT Tracking Portal</h1>
        <div class="meta" id="meta">Loading…</div>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="themeBtn" title="Toggle light / dark">◐ Theme</button>
      <button class="btn" id="csvBtn" title="Download the current table as CSV">⭳ CSV</button>
    </div>
    <div class="filters">
      <div class="f"><label for="fKam">KAM</label><select id="fKam"></select></div>
      <div class="f"><label for="fAcc">Account</label><select id="fAcc"></select></div>
      <div class="f"><label for="fWh">Warehouse</label><select id="fWh"></select></div>
      <div class="f"><label for="fBrand">Brand</label><select id="fBrand"></select></div>
      <div class="f"><label for="fWeek">Week</label><select id="fWeek"></select></div>
      <div class="f"><label>Unit</label><div class="seg" id="fUnit"><button data-u="Box" class="on">Box</button><button data-u="Amount">M VND</button></div></div>
      <div class="f"><label for="fFrom">Order date from</label><input type="date" id="fFrom"></div>
      <div class="f"><label for="fTo">to</label><input type="date" id="fTo"></div>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="overview" class="on">Overview</button>
      <button data-t="sku">SKU tracking</button>
      <button data-t="acc">Accounts</button>
      <button data-t="yag">YAG vs Tết 2026</button>
      <button data-t="inb">Inbound late</button>
      <button data-t="about">How it works</button>
    </nav>
  </div>
</header>
<main class="wrap" id="main"></main>
<div class="tip" id="tip"></div>
<script>document.write('<script src="Tet_Portal_Data.js?v='+Date.now()+'"><\/script>');</script>
<script>
(function(){
'use strict';
const D = window.TET_DATA;
const $ = s => document.querySelector(s);
const main = $('#main');
if(!D){
  main.innerHTML = '<div class="err"><h2>Data file not found</h2><p>Keep <code>Tet_Portal_Data.js</code> in the same folder as this page. It is written by the <b>Update Data</b> button in the Excel workbook (Control → Web export folder).</p></div>';
  $('#meta').textContent = 'No data'; return;
}
// ---------- index data ----------
const W = D.weeks.map((w,i)=>({i:i+1,w:w[0],tet:w[1],start:w[2],m:w[3]}));
const SKU = {}; D.skus.forEach(s=>SKU[s[0]]={code:s[0],brand:s[1],name:s[2],price:s[3]});
const brandOf = c => (SKU[c]||{}).brand || '(Other)';
const P = D.plan.map(r=>({wh:r[0],whs:r[1],area:r[2],acc:r[3],kam:r[4],sku:r[5],wi:r[6],mi:r[7],box:r[8],amt:r[9]}));
const A = D.act.map(r=>({wh:r[0],whs:r[1],area:r[2],acc:r[3],kam:r[4],sku:r[5],wi:r[6],mi:r[7],date:r[8],ob:r[9],oa:r[10],db:r[11],da:r[12]}));
const S = D.stock.map(r=>({wh:r[0],sku:r[1],q:r[2],a:r[3]}));
const Y = D.y26.map(r=>({area:r[0],acc:r[1],kam:r[2],sku:r[3],wi:r[4],box:r[5],amt:r[6]}));
const L = D.late.map(r=>({acc:r[0],center:r[1],kam:r[2],sku:r[3],name:r[4],date:r[5],days:r[6],accNew:r[7]||''}));
const ACC = D.accounts.map(a=>({acc:a[0],kam:a[1]}));
const KAMS = [...new Set(ACC.map(a=>a.kam).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));
const BRANDS = [...new Set(D.skus.map(s=>s[1]))];
const WHS = ['MT Total','YP','MP','DN','DN North','DN South'];
// ---------- state ----------
const st = {kam:'All',acc:'All',wh:'MT Total',brand:'All',unit:'Box',week:D.curWeek||1,from:'',to:'',tab:'overview',sort:{}};
try{ const s = JSON.parse(localStorage.getItem('tetPortal')||'{}'); if(s.kam) st.kam=s.kam; if(s.tab) st.tab=s.tab; }catch(e){}
const save = ()=>{ try{ localStorage.setItem('tetPortal',JSON.stringify({kam:st.kam,tab:st.tab})); }catch(e){} };
// ---------- formatting ----------
const val = (box,amt) => st.unit==='Box' ? box : amt/1e6;
const nf0 = new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const nf1 = new Intl.NumberFormat('en-US',{maximumFractionDigits:1,minimumFractionDigits:1});
const fmt = v => (v==null||isNaN(v)) ? '–' : (Math.abs(v)<0.05 ? '–' : (st.unit==='Box'? nf0.format(v) : nf1.format(v)));
const sgn = v => (v>0?'+':'') + fmt(v);
const pct = v => (v==null||!isFinite(v)) ? '–' : Math.round(v*100)+'%';
const pctCls = v => (v==null||!isFinite(v)) ? '' : (v<0.9?'lo':(v>1.1?'hi':''));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uLbl = () => st.unit==='Box' ? 'Box' : 'M VND';
// ---------- filters ----------
function whMatchP(r){ if(st.wh==='MT Total') return r.wh!==''; if(st.wh.startsWith('DN ')) return r.whs===st.wh; return r.wh===st.wh; }
function whMatchA(r){ if(st.wh==='MT Total') return r.wh==='YP'||r.wh==='MP'||r.wh==='DN'; if(st.wh.startsWith('DN ')) return r.whs===st.wh; return r.wh===st.wh; }
const kamOk = r => st.kam==='All' || r.kam===st.kam;
const accOk = r => st.acc==='All' || r.acc===st.acc;
const brandOk = r => st.brand==='All' || brandOf(r.sku)===st.brand;
const dateOk = r => (!st.from || r.date>=st.from) && (!st.to || r.date<=st.to);
const fP = () => P.filter(r=>whMatchP(r)&&kamOk(r)&&accOk(r)&&brandOk(r));
const fA = () => A.filter(r=>whMatchA(r)&&kamOk(r)&&accOk(r)&&brandOk(r));
function stockOf(sku){ // current WH stock
  const whs = st.wh==='MT Total'?['YP','MP','DN']:(st.wh.startsWith('DN ')?['DN']:[st.wh]);
  let s=0; S.forEach(r=>{ if(r.sku===sku && whs.includes(r.wh)) s+= st.unit==='Box'?r.q:r.a/1e6; }); return s;
}
function noteStock(p,o,d,s){
  if(Math.abs(p)<1e-9 && Math.abs(o)<1e-9) return '';
  const n=[]; if(o>p) n.push('Over Plan'); if(o>p && d+s<o) n.push('Warning Loss'); if(d+s<p) n.push('Insufficient Stock for Plan');
  return n.length? n.join(' | ') : 'OK';
}
function notePill(t){
  if(!t) return '<span class="pill mute">–</span>';
  return t.split(' | ').map(x=>`<span class="pill ${x==='OK'?'ok':(x==='Warning Loss'?'bad':(x.startsWith('Insufficient')?'bad':'warn'))}">${esc(x)}</span>`).join(' ');
}
// ---------- tooltip ----------
const tip = $('#tip');
function showTip(e,html){ tip.innerHTML=html; tip.style.display='block'; const x=Math.min(e.clientX+14, innerWidth-tip.offsetWidth-8); const y=Math.min(e.clientY+14, innerHeight-tip.offsetHeight-8); tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }
// ---------- charts ----------
function weeklyChart(rows){ // rows: {lbl,sub,plan,order,deli,y26,future}
  const w=Math.max(620, main.clientWidth*0.58), h=260, m={l:56,r:12,t:12,b:40};
  const iw=w-m.l-m.r, ih=h-m.t-m.b;
  const mx=Math.max(1,...rows.map(r=>Math.max(r.plan,r.order,r.deli,r.y26)));
  const step=niceStep(mx/4), top=Math.ceil(mx/step)*step;
  const bw=iw/rows.length, b=Math.max(3,Math.min(14,(bw-10)/3));
  const yy=v=>m.t+ih-(v/top)*ih;
  let g='';
  for(let v=0; v<=top+1e-9; v+=step){ g+=`<line x1="${m.l}" x2="${w-m.r}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${m.l-8}" y="${yy(v)+4}" text-anchor="end">${fmtAxis(v)}</text>`; }
  rows.forEach((r,i)=>{
    const cx=m.l+bw*i+bw/2, x0=cx-1.5*b-2;
    [['plan','var(--s-plan)'],['order','var(--s-order)'],['deli','var(--s-deli)']].forEach(([k,c],j)=>{
      const v=r[k]; if(!(v>0)) return; const x=x0+j*(b+2), y=yy(v);
      g+=`<path d="M${x},${m.t+ih} V${y+3} q0,-3 3,-3 h${b-6} q3,0 3,3 V${m.t+ih} Z" fill="${c}"/>`;
    });
    g+=`<text x="${cx}" y="${h-m.b+16}" text-anchor="middle" ${r.cur?'style="fill:var(--text);font-weight:700"':''}>${r.lbl}</text><text x="${cx}" y="${h-m.b+30}" text-anchor="middle" style="font-size:10px">${r.sub}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${m.l+bw*i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`;
  });
  const pts=rows.map((r,i)=>[m.l+bw*i+bw/2, yy(r.y26)]);
  g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--s-y26)" stroke-width="2" stroke-dasharray="5 4"/>`;
  pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--s-y26)" stroke="var(--surface)" stroke-width="2"/>`);
  const svg=`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Weekly plan, order, deli and Y26">${g}</svg>`;
  return {svg, bind(el){ el.querySelectorAll('.hit').forEach(n=>{ n.addEventListener('mousemove',e=>{ const r=rows[+n.dataset.i]; showTip(e,`<b>${r.lbl} · Tết ${r.sub}</b><div class="row"><span>Plan</span><span>${fmt(r.plan)}</span></div><div class="row"><span>Order</span><span>${fmt(r.order)}</span></div><div class="row"><span>Deli</span><span>${fmt(r.deli)}</span></div><div class="row"><span>Y26 same Tết week</span><span>${fmt(r.y26)}</span></div>`);}); n.addEventListener('mouseleave',hideTip); }); }};
}
function dailyChart(days){ // [{d,o,dl}]
  if(!days.length) return {svg:'<div class="empty">No orders in this date range.</div>',bind(){}};
  const w=Math.max(360, main.clientWidth*0.36), h=260, m={l:50,r:8,t:12,b:34}, iw=w-m.l-m.r, ih=h-m.t-m.b;
  const mx=Math.max(1,...days.map(d=>Math.max(d.o,d.dl))); const step=niceStep(mx/4), top=Math.ceil(mx/step)*step;
  const bw=iw/days.length, b=Math.max(2,Math.min(10,(bw-4)/2)); const yy=v=>m.t+ih-(v/top)*ih; let g='';
  for(let v=0; v<=top+1e-9; v+=step){ g+=`<line x1="${m.l}" x2="${w-m.r}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)"/><text x="${m.l-6}" y="${yy(v)+4}" text-anchor="end">${fmtAxis(v)}</text>`; }
  const every=Math.ceil(days.length/10);
  days.forEach((d,i)=>{ const cx=m.l+bw*i+bw/2;
    [['o','var(--s-order)'],['dl','var(--s-deli)']].forEach(([k,c],j)=>{ const v=d[k]; if(!(v>0))return; const x=cx-b-1+j*(b+2), y=yy(v); g+=`<rect x="${x}" y="${y}" width="${b}" height="${m.t+ih-y}" rx="2" fill="${c}"/>`; });
    if(i%every===0) g+=`<text x="${cx}" y="${h-m.b+16}" text-anchor="middle">${d.d.slice(8,10)}/${d.d.slice(5,7)}</text>`;
    g+=`<rect class="hit" data-i="${i}" x="${m.l+bw*i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent"/>`; });
  return {svg:`<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="Daily order and deli">${g}</svg>`, bind(el){ el.querySelectorAll('.hit').forEach(n=>{ n.addEventListener('mousemove',e=>{ const d=days[+n.dataset.i]; showTip(e,`<b>${d.d}</b><div class="row"><span>Order</span><span>${fmt(d.o)}</span></div><div class="row"><span>Deli</span><span>${fmt(d.dl)}</span></div>`);}); n.addEventListener('mouseleave',hideTip); }); }};
}
function niceStep(x){ if(x<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function fmtAxis(v){ return v>=1e6? (v/1e6).toFixed(1)+'M' : v>=1e3? Math.round(v/1e3)+'k' : String(Math.round(v)); }
// ---------- aggregation ----------
function totals(){
  const p=fP(), a=fA(), wk=st.week; const t={season:0,ptdP:0,ptdO:0,ptdD:0,wP:0,wO:0,wD:0};
  p.forEach(r=>{ const v=val(r.box,r.amt); t.season+=v; if(r.wi>=1&&r.wi<=wk) t.ptdP+=v; if(r.wi===wk) t.wP+=v; });
  a.forEach(r=>{ const o=val(r.ob,r.oa), d=val(r.db,r.da); if(r.wi>=1&&r.wi<=wk){t.ptdO+=o;t.ptdD+=d;} if(r.wi===wk){t.wO+=o;t.wD+=d;} });
  return t;
}
function yagArea(){ return st.wh==='MT Total'?null:(['YP','DN North'].includes(st.wh)?'North':(['MP','DN South'].includes(st.wh)?'South':'X')); }
function weekly(){
  const p=fP(), a=fA(); const ar=yagArea();
  const y=Y.filter(r=>kamOk(r)&&accOk(r)&&brandOk(r)&&(ar===null||r.area===ar));
  return W.map(w=>({lbl:w.w,sub:w.tet,cur:w.i===st.week,
    plan:p.filter(r=>r.wi===w.i).reduce((s,r)=>s+val(r.box,r.amt),0),
    order:w.i>st.week?0:a.filter(r=>r.wi===w.i).reduce((s,r)=>s+val(r.ob,r.oa),0),
