<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tết 2027 MT Portal</title>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f6f8fb; --line:#e4e8ef; --line-strong:#d0d7e1;
  --text:#14202e; --text-2:#4a5868; --text-3:#7b8898;
  --accent:#2563eb; --accent-bg:#e8f0fe; --accent-ink:#1d4ed8; --fon:#fff6dc; --fon-line:#e9c46a;
  --s-plan:#a9bbd0; --s-order:#2a78d6; --s-deli:#1baf7a; --s-y26:#eb6834;
  --good:#1f7a3f; --good-bg:#e1f2e6; --good-bar:#22a35a; --warn:#8a5a00; --warn-bg:#fff0c2; --warn-bar:#f0a020; --bad:#a3271f; --bad-bg:#fbe1de; --bad-bar:#e0483d; --info:#245ea8; --info-bg:#e5effc;
  --c1:#2a78d6; --c2:#1baf7a; --c3:#eb6834; --c4:#8a63d2; --c5:#d1a20f; --c6:#2aa5b8; --c7:#c2457a; --c8:#5d7a3a; --c9:#b0742b; --c10:#9aa5b1;
  --shadow:0 1px 2px rgba(16,32,48,.04),0 4px 16px rgba(16,32,48,.05);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1318; --surface:#181d24; --surface-2:#1f262e; --line:#2a323c; --line-strong:#38424e;
  --text:#edf1f5; --text-2:#b3bec9; --text-3:#84909d; --accent:#5b9bff; --accent-bg:#1c2b44; --accent-ink:#9cc3ff; --fon:#3a3118; --fon-line:#8a6d1e;
  --s-plan:#5b6e86; --s-order:#3987e5; --s-deli:#199e70; --s-y26:#d95926;
  --good:#7fd39a; --good-bg:#1b3125; --warn:#f0c868; --warn-bg:#3a2f12; --bad:#f19a92; --bad-bg:#3d1f1d; --info:#9cc3f5; --info-bg:#1b2a3e;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1600px;margin:0 auto;padding:0 20px}
/* ---- header (white) ---- */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30;box-shadow:0 1px 8px rgba(16,32,48,.05)}
.tb{display:flex;align-items:center;gap:14px;padding:12px 0 8px}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#e2483d,#f2a03d);display:grid;place-items:center;font-size:21px;box-shadow:0 4px 12px rgba(226,72,61,.25)}
.brandtxt > b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brandtxt .subl{font-size:12px;color:var(--text-2);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.subl .dot{color:var(--line-strong)}
.subl b{font-weight:650;color:var(--text)}
.pace-chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-bg);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-weight:600}
.sp{flex:1}
.tbtn{border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 12px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--surface-2)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px}
nav.tabs button{border:1px solid transparent;background:none;color:var(--text-2);padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;border-radius:999px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
nav.tabs button:hover{background:var(--surface-2);color:var(--text)}
nav.tabs button.on{background:var(--accent-bg);color:var(--accent-ink);font-weight:650;border-color:#c9dafc;box-shadow:inset 0 -2px 0 var(--accent)}
/* ---- filters ---- */
.filters{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;z-index:25;box-shadow:0 6px 14px -12px rgba(16,32,48,.25)}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:10px 20px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:96px}
.f select{max-width:180px}
.f label{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
select,input[type=search]{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;min-height:32px}
input[type=search]{min-width:190px}
.f.on select,.f.on input,.f.on .wkbtn{background:var(--fon);border-color:var(--fon-line);font-weight:600}
.f.on label{color:var(--warn)}
.f.on label::after{content:" ●";color:var(--warn-bar)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);color:var(--text-2);padding:6px 11px;font:inherit;cursor:pointer;min-height:30px}
.seg button.on{background:var(--accent);color:#fff}
.wkbtn{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;min-height:32px;cursor:pointer;min-width:160px;text-align:left}
.pop{position:absolute;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px;z-index:60;display:none;width:330px}
.pop .grid5{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pop label{display:flex;gap:6px;align-items:center;font-size:12px;padding:3px 4px;border-radius:6px;cursor:pointer}
.pop label:hover{background:var(--surface-2)}
.pop .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pop .acts button{font:inherit;font-size:12px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:6px;padding:4px 8px;cursor:pointer}
.reset{font:inherit;font-size:12px;border:0;background:none;color:var(--info);cursor:pointer;padding:6px 4px}
.geo-note{margin:0 0 14px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--fon-line);border-radius:10px;padding:8px 12px;font-size:12.5px}
main{padding:22px 0 56px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.kpi{position:relative}
.kpi .lab{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .ico{font-size:16px;line-height:1}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--text-2);margin-top:1px}
.card h2{font-size:14px;margin:0 0 10px;font-weight:650;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .ico{font-size:15px}
.card h2 .hint{font-weight:400;color:var(--text-3);font-size:12px}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tw{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.ow{grid-template-columns:minmax(330px,.9fr) minmax(0,2.1fr)}
@media (max-width:1100px){.two,.tw,.three,.ow{grid-template-columns:1fr}}
.mt{margin-top:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:0;width:14px;border-top:2px dashed var(--s-y26);border-radius:0;vertical-align:3px}
svg text{fill:var(--text-3);font-size:11px}
.tbl{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th,td{padding:5px 7px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:600;z-index:2;cursor:pointer;user-select:none}
thead tr.grp th{top:0;cursor:default;text-align:center;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
thead tr.grp + tr th{top:27px}
th.l,td.l{text-align:left}
th.sep,td.sep{border-left:2px solid var(--line-strong)}
td.wrap{white-space:normal;min-width:200px;max-width:340px;text-align:left;color:var(--text-2);font-size:11.5px}
td.nm{white-space:normal;text-align:left;max-width:230px;min-width:150px}
td.nm .t{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
td.ms{white-space:normal;text-align:left;max-width:260px;min-width:140px;font-size:11px;color:var(--bad)}
td.sk{text-align:left;white-space:nowrap;height:40px;vertical-align:middle}
.skc b{display:block;font-weight:650;line-height:1.25}
.skc span{display:block;font-size:10.5px;color:var(--text-3);line-height:1.2;font-variant-numeric:tabular-nums}
tr.stot td{background:var(--surface-2);font-weight:650;border-top:1px solid var(--line-strong)}
tr.big4 td{background:#fff6dc} :root[data-theme="dark"] tr.big4 td{background:#3a3118}
tr.shT td{background:var(--surface-2);font-weight:650} tr.shD td,tr.shN td{color:var(--text-2);font-size:11.5px}
td.nt{white-space:normal;text-align:left;min-width:280px;max-width:320px;font-size:11px;color:var(--text-2)}
td.nt .c,td.ms .c{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
tbody tr:hover td{background:var(--surface-2)}
tr.tot td{font-weight:700;background:var(--surface-2)}
tr.ghdr td{background:var(--info-bg);color:var(--info);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.04em;text-align:left}
tr.sub td{color:var(--text-3)}
tr.sub td:first-child{padding-left:26px}
tr.com td{background:#eef7f1}
:root[data-theme="dark"] tr.com td{background:#16271d}
td.num{font-variant-numeric:tabular-nums}
td.comc{background:#eef7f1} :root[data-theme="dark"] td.comc{background:#16271d}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:650;white-space:nowrap;margin:1px 2px 1px 0}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--surface-2);color:var(--text-3)} .pill.info{background:var(--info-bg);color:var(--info)}
.pct.lo{color:var(--bad);font-weight:650} .pct.hi{color:var(--warn);font-weight:650} .pct.ok{color:var(--good);font-weight:650}
.prog{display:inline-flex;align-items:center;gap:6px}
.prog .tr{width:70px;height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--s-deli)}
.prog .tr i.mid{background:var(--c5)} .prog .tr i.low{background:var(--bad)}
/* pacing bar */
.pb{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.pb .tr{position:relative;width:120px;height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line)}
.pb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.pb .tr i.g{background:var(--good-bar)} .pb .tr i.o{background:var(--warn-bar)} .pb .tr i.r{background:var(--bad-bar)}
.pb .tr u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);border-radius:1px}
.pb .v{font-weight:700;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.pb .gp{font-size:11px;font-weight:650;border-radius:999px;padding:1px 7px;min-width:62px;text-align:center}
.gp.g{background:var(--good-bg);color:var(--good)} .gp.o{background:var(--warn-bg);color:var(--warn)} .gp.r{background:var(--bad-bg);color:var(--bad)}
.pleg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-3);margin-top:8px;align-items:center}
.pleg i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.tick{font-weight:700}
.tick.y{color:var(--good)} .tick.p{color:var(--warn)} .tick.n{color:var(--bad)}
.muted{color:var(--text-3)}
.foot{font-size:11.5px;color:var(--text-3);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:80;display:none;min-width:160px}
.tip b{display:block;margin-bottom:4px}
.tip .row{display:flex;justify-content:space-between;gap:16px}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.donutwrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.dleg{display:grid;grid-template-columns:auto 1fr auto;gap:3px 9px;font-size:11.5px;align-items:center;min-width:180px;flex:1}
.dleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.xbtn{border:0;background:none;color:var(--info);cursor:pointer;font:inherit;padding:0 4px}
.err{max-width:640px;margin:80px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
/* countdown */
.cd{background:linear-gradient(140deg,#fff1e6 0%,#fff8f1 60%,#fff 100%);border-color:#f6d7b8}
:root[data-theme="dark"] .cd{background:linear-gradient(140deg,#2a1d12 0%,var(--surface) 60%);border-color:#4a3420}
.cd .now{font-size:12.5px;color:var(--text-2)}
.cd .clock{font-size:30px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.cd .big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.cd .big b{font-size:44px;line-height:1;color:#d2392f;letter-spacing:-.03em}
.cd .big span{font-size:13px;color:var(--text-2)}
.cd .tl{margin-top:10px}
.cd .tl .tr{height:8px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.cd .tl .tr i{display:block;height:100%;background:linear-gradient(90deg,#f2a03d,#e2483d)}
.cd .tl .lb{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);margin-top:3px}
.exec{margin-top:12px;border-top:1px dashed var(--line-strong);padding-top:10px}
.exec h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
.exec ul{margin:0;padding:0;list-style:none;display:grid;gap:5px}
.exec li{font-size:12.5px;display:flex;gap:7px;align-items:flex-start}
.exec li .e{flex:none}
.slider{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--text-2);margin-top:6px}
.slider input{flex:1;accent-color:var(--accent)}
.hbar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 70px;gap:8px;align-items:center;margin:4px 0;font-size:12px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .tr{height:12px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.hbar .tr i{display:block;height:100%}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums}
.chips2{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.ach{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:2px 9px;font-size:12px}
.ach b{font-variant-numeric:tabular-nums}
.stat-big{font-size:34px;font-weight:750;letter-spacing:-.02em}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="tb">
      <div class="mark" aria-hidden="true">🧧</div>
      <div class="brandtxt"><b>Tết 2027 · MT Tracking Portal</b><div class="subl" id="subl"></div></div>
      <div class="sp"></div>
      <button class="tbtn primary" id="csvBtn" title="Xuất các bảng của trang này theo bộ lọc hiện tại">⬇ CSV</button>
      <button class="tbtn" id="themeBtn" title="Light / dark">◐</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="overview">📊 Overview</button>
      <button data-t="sku">📦 SKU Tracking</button>
      <button data-t="store">🏬 Store Tracking</button>
      <button data-t="acc">🤝 Accounts</button>
      <button data-t="yag">📈 YAG</button>
      <button data-t="inb">🚚 Inbound Late</button>
      <button data-t="warn">⚠️ Warning / Loss</button>
      <button data-t="stock">🏭 Stock</button>
    </nav>
  </div>
</header>
<section class="filters" id="filters">
  <div class="wrap fr">
    <div class="f" data-f="kam"><label for="fKam">KAM</label><select id="fKam"></select></div>
    <div class="f" data-f="ch"><label for="fCh">Channel</label><select id="fCh"></select></div>
    <div class="f" data-f="acc"><label for="fAcc">Account</label><select id="fAcc"></select></div>
    <div class="f" data-f="a2"><label for="fA2">Account 2</label><select id="fA2"></select></div>
    <div class="f" data-f="sg"><label for="fSg">Sales Group</label><select id="fSg"></select></div>
    <div class="f" data-f="office"><label for="fOff">Office</label><select id="fOff"></select></div>
    <div class="f" data-f="prov"><label for="fProv">Province</label><select id="fProv"></select></div>
    <div class="f" data-f="wh"><label for="fWh">Warehouse</label><select id="fWh"></select></div>
    <div class="f" data-f="brand"><label for="fBrand">Brand</label><select id="fBrand"></select></div>
    <div class="f" data-f="weeks" style="position:relative"><label>Weeks</label><button class="wkbtn" id="wkBtn"></button><div class="pop" id="wkPop"></div></div>
    <div class="f" data-f="status"><label for="fStatus">Status</label><select id="fStatus"></select></div>
    <div class="f" data-f="q"><label for="fQ">Search SKU / Store</label><input type="search" id="fQ" placeholder="Mã, tên SKU hoặc tên store…"></div>
    <div class="f"><label>Unit</label><div class="seg" id="fUnit"><button data-u="Box">Box</button><button data-u="Amount">M VND</button></div></div>
    <button class="reset" id="resetBtn">↺ Reset filters</button>
  </div>
</section>
<main class="wrap" id="main"></main>
<div class="tip" id="tip"></div>
<script>document.write('<script src="Tet_Portal_Data.js?v='+Date.now()+'"><\/script>');</script>
<script>
(function(){
'use strict';
const D = window.TET_DATA;
const $ = s => document.querySelector(s);
const main = $('#main');
if(!D){ main.innerHTML='<div class="err"><h2>Data file not found</h2><p>Keep <code>Tet_Portal_Data.js</code> next to this page (written by <b>Update Data</b> in the Excel file).</p></div>'; return; }
// ================= DATA =================
const W = D.weeks.map((w,i)=>({i:i+1,w:w[0],tet:w[1],start:w[2],m:w[3]}));
const SKU = {}; D.skus.forEach(s=>SKU[s[0]]={code:s[0],brand:s[1],name:s[2],price:s[3]});
const SKU_ORDER = D.skus.map(s=>s[0]);
const BR = (D.brands&&D.brands.length? D.brands : [...new Set(D.skus.map(s=>s[1]))].map(b=>[b,'',''])).map(b=>({b:b[0],cat:b[1],sub:b[2]}));
const BR_IDX = {}; BR.forEach((b,i)=>BR_IDX[b.b]=i);
const brandOf = c => (SKU[c]||{}).brand || '(Other)';
const ACC = D.accounts.map((a,i)=>({acc:a[0],kam:a[1],ch:a[2]||'',i}));
const ACC_IDX = {}, CH_OF = {}; ACC.forEach(a=>{ACC_IDX[a.acc]=a.i; CH_OF[a.acc]=a.ch;});
const CHANNELS = [...new Set(ACC.map(a=>a.ch).filter(Boolean))];
const chOf = acc => CH_OF[acc] || 'Other';
const accIdx = acc => (acc in ACC_IDX)? ACC_IDX[acc] : 999;
const P = D.plan.map(r=>{ const o={wh:r[0],whs:r[1],area:r[2],acc:r[3],kam:r[4],sku:r[5],wi:r[6],mi:r[7],box:r[8],amt:r[9]}; o.sg = o.acc==='ECOM'?'KAM Part':(o.area==='North'?'MT North Center':(o.area==='South'?'MT South Center':'')); return o; });
const EXCL_OFF=new Set(['','MT North Center','MT South Center']);
const STORES = (D.stores||[]).map(r=>{ const o={code:r[0],name:r[1],acc:r[2],sg:r[3]||'',office:r[4]||'',dc:r[5]===1,parent:r[6]||'',prov:r[7]||'',ch1:r[8]||'',a2:r[9]||''};

    const cell=(d,sh,f)=>{ const x=(PMAP[c+'|'+w+'|'+d]||{})[sh]; return x?f(x):null; };
    ['T','D','N'].forEach(sh=>{ if(sh!=='T'&&!open) return; const r={...base,_cls:'sh'+sh,shift:{T:'Total',D:'Day',N:'Night'}[sh],first:sh==='T'}; days.forEach((d,i)=>r['d'+i]=cell(d,sh,x=>VB(x.p,c))); t3.push(r); });
    [['Plan',x=>VB(x.p,c)],['Actual',x=>VB(x.a,c)],['Gap',x=>VB(x.a-x.p,c)]].forEach(([lab,f],j)=>{ const r={...base,_cls:j===0?'shT':'shD',shift:lab,first:j===0}; days.forEach((d,i)=>{ const v=cell(d,'T',f); r['d'+i]=(lab!=='Plan'&&d>TODAY)?null:v; }); t4.push(r); }); });
  const dayCols=(gap)=>days.map((d,i)=>({k:'d'+i,l:dmy(d),sep:i===0||(dW[i]&&dW[i-1]&&dW[i].i!==dW[i-1].i),f:r=>{ const v=r['d'+i]; if(v==null) return '<span class="muted">–</span>'; if(gap&&r.shift==='Gap') return `<span class="pct ${v<0?'lo':(v>0?'ok':'')}">${sgn(v)}</span>`; return fmt(v); },sort:r=>r['d'+i]||0}));
  const fixC=[{k:'wh',l:'WH',cls:'l',f:r=>r.first?`<b>${r.wh}</b>`:''},{k:'brand',l:'Brand',cls:'l',f:r=>r.first?esc(r.brand):''},{k:'code',l:'Item name / code',cls:'sk',f:r=>r.first?skuCell(r.code,r.name):''},{k:'stk',l:'Current Stock',f:r=>r.first?fmt(r.stk):''},{k:'shift',l:'',cls:'l',f:r=>`<span class="${r.first?'':'muted'}">${r.shift}</span>`}];
  const noFut=!PROD.some(p=>p.d>=TODAY&&p.p>0);
  const sttPill2=s=>{ const [c,t]=s.split('|'); return `<span class="pill ${c}">${t}</span>`; };
  main.innerHTML=kpiRow([['🏭','Tổng tồn SKU Tết',fmt(tot),`${uLbl()} · ${srows.filter(r=>r.t>0).length} SKU có tồn`],['🚚','Kho MT',fmt(com),`WH15 · WH33 · WH34 = ${pct(tot?com/tot:null)}`],
     ['🏗️','Kho nhà máy',fmt(tot-com),`WH09 · WH10 = ${pct(tot?(tot-com)/tot:null)}`],['⚙️',`SX còn lại ${TW?TW.w:''}`,fmt(srows.reduce((s,r)=>s+r.rT,0)),`từ ${dmy(TODAY)} → ${dmy(TW_END)}`],
     ['📅',`SX ${NW?NW.w:'tuần sau'}`,fmt(srows.reduce((s,r)=>s+r.nT,0)),NW?`${dmy(NW.start)} → ${dmy(addDay(NW.start,6))}`:'–'],['🎯','Plan còn lại',fmt(remT),'Plan cả kỳ − Deli lũy kế']])+`
   ${geoActive()||st.kam!=='All'||st.acc!=='All'||st.ch!=='All'?'<div class="geo-note mt">ℹ️ Tồn kho và sản xuất không chia theo KAM / Account / Channel / Tỉnh / Office – các bộ lọc này chỉ ảnh hưởng phần nhu cầu (Plan).</div>':''}
   ${noFut?`<div class="geo-note mt">ℹ️ Sheet Production hiện chỉ có dữ liệu đến ${dmy(PROD.reduce((m,p)=>p.d>m?p.d:m,''))}. Các cột sản xuất từ hôm nay trở đi đang để trống – dán kế hoạch các ngày tới vào sheet Production rồi bấm Update để web tự nhận.</div>`:''}
   <div class="grid tw mt"><div class="card"><h2><span class="ico">🧱</span>Stock by Brand × WH<span class="hint">${uLbl()} · màu đậm = tồn nhiều</span></h2>
     ${table('stb',[{k:'brand',l:'Brand',cls:'l',sort:r=>BR_IDX[r.brand]??99},{k:'MP',l:'MP',f:r=>r._cls?fmt(r.MP):heat(r.MP)},{k:'DN',l:'DN',f:r=>r._cls?fmt(r.DN):heat(r.DN)},{k:'YP',l:'YP',f:r=>r._cls?fmt(r.YP):heat(r.YP)},cN('t','Total',true)],[btot,...brows],{title:'Stock by brand x WH'})}</div>
    <div class="card"><h2><span class="ico">🏬</span>Stock by warehouse<span class="hint">mapping Setting cột V (WH) → AD (WH2) · nền xanh = Kho MT</span></h2>
     ${table('stw',[{k:'code',l:'Mã kho',cls:'l',f:r=>`<b>${esc(r.code)}</b>`},{k:'wh',l:'Kho',cls:'l'},{k:'type',l:'Loại',cls:'l',f:r=>`<span class="pill ${COMM.has(r.code)?'ok':'mute'}">${esc(r.type||'–')}</span>`},cN('q','Tồn'),{k:'sh',l:'Tỷ trọng',f:r=>prog(r.sh,pct(r.sh)),sort:r=>r.sh},{k:'n',l:'SKU có tồn'}],crow,{title:'Stock by warehouse'})}
     <div class="foot">MP = WH09 (nhà máy) + WH33 · YP = WH10 (nhà máy) + WH34 · DN = WH15.</div></div></div>
   <div class="card mt"><h2><span class="ico">📦</span>Stock by SKU<span class="hint">${uLbl()} · Fulfillment = (Stock + SX còn lại tuần này + SX tuần sau) / (Plan PTD − Deli PTD) · ≥100% Đủ · 80–100% Sát · &lt;80% Thiếu</span></h2>
   ${table('sts',[{k:'brand',l:'Brand',cls:'l',sort:r=>BR_IDX[r.brand]??99},SKC(),cN('MP','MP',true),cN('YP','YP'),cN('DN','DN'),cN('t','Total'),
     cN('rMP','MP',true),cN('rYP','YP'),cN('rT','Total'),cN('nMP','MP',true),cN('nYP','YP'),cN('nT','Total'),
     cN('need','Nhu cầu PTD còn thiếu',true),{k:'sp',l:'Supply %',f:r=>r.sp==null?'<span class="muted">–</span>':`<span class="pct ${r.sp>=1?'ok':(r.sp>=0.8?'hi':'lo')}">${pct(r.sp)}</span>`,sort:r=>r.sp==null?9e9:r.sp},{k:'stt',l:'Fulfillment / Coverage Status',cls:'l',f:r=>sttPill2(r.stt),sort:r=>r.sp==null?9e9:r.sp}],
     srows,{groups:[{l:'',n:2},{l:'Current Stock',n:4,sep:1},{l:`Rem. This Week Prod. (${dmy(TODAY)}→${dmy(TW_END)})`,n:3,sep:1},{l:`Next Week Prod. ${NW?'('+NW.w+')':''}`,n:3,sep:1},{l:'Fulfillment',n:3,sep:1}],title:'Stock by SKU',maxh:720})}</div>
   <div class="card mt"><h2><span class="ico">🗓️</span>Production Schedule by SKU by Day<span class="hint">kế hoạch sản xuất (cột Plan) ${dmy(TODAY)} → ${dmy(days[days.length-1])} · ${uLbl()}</span> <button class="tbtn" id="shBtn" style="padding:3px 10px;font-size:12px">${open?'▾ Ẩn ca Day / Night':'▸ Hiện ca Day / Night'}</button></h2>
   ${table('prs',[...fixC,...dayCols(false)],t3.map(r=>({...r,_fixed:true})),{groups:[{l:'',n:5},...wgr.map((g,i)=>({l:g.w,n:g.n,sep:1}))],title:'Production schedule',maxh:720})}</div>
   <div class="card mt"><h2><span class="ico">📈</span>Actual Production Tracking by Day<span class="hint">dòng Total · Plan / Actual (cột Result) / Gap = Actual − Plan · ngày tương lai chỉ có Plan</span></h2>
   ${table('pra',[...fixC,...dayCols(true)],t4.map(r=>({...r,_fixed:true})),{groups:[{l:'',n:5},...wgr.map((g,i)=>({l:g.w,n:g.n,sep:1}))],title:'Actual production',maxh:720})}</div>`;
  const b=document.getElementById('shBtn'); if(b) b.onclick=()=>{ st.open.shift=!st.open.shift; render(); };
}
// ================= CONTROLS =================
function fill(el,opts,cur){ el.innerHTML=opts.map(o=>{ const v=Array.isArray(o)?o[0]:o, l=Array.isArray(o)?o[1]:o; return `<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(l)}</option>`; }).join(''); }
function syncControls(){
  fill($('#fKam'),['All',...KAMS],st.kam); fill($('#fCh'),['All',...CHANNELS],st.ch);
  const accs=ACC.filter(a=>(st.kam==='All'||a.kam===st.kam)&&(st.ch==='All'||a.ch===st.ch)).map(a=>a.acc); if(st.acc!=='All'&&!accs.includes(st.acc)) st.acc='All';
  fill($('#fAcc'),['All',...accs],st.acc);
  const a2s=[...new Set(A.filter(r=>kamOk(r)&&accOk(r)&&chOk(r)).map(r=>r.a2).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi')); if(st.a2!=='All'&&!a2s.includes(st.a2)) st.a2='All';
  fill($('#fA2'),['All',...a2s],st.a2); fill($('#fSg'),['All',...SGS],st.sg); fill($('#fWh'),WHS,st.wh); fill($('#fBrand'),['All',...BR.map(b=>b.b)],st.brand);
  const offs=OFFICES.filter(o=>st.sg==='All'||STORES.some(s=>s.office===o&&s.sg===st.sg)); if(st.office!=='All'&&!offs.includes(st.office)) st.office='All';
  const provs=PROVS.filter(p=>(st.sg==='All'&&st.office==='All')||STORES.some(s=>s.prov===p&&(st.sg==='All'||s.sg===st.sg)&&(st.office==='All'||s.office===st.office))); if(st.prov!=='All'&&!provs.includes(st.prov)) st.prov='All';
  fill($('#fOff'),['All',...offs],st.office); fill($('#fProv'),['All',...provs],st.prov);
  fill($('#fStatus'),['All','Over Plan','Under Plan','Warning Loss','Low Stock','Late Inbound'],st.status);
  $('#wkBtn').textContent='▦ '+weekLbl()+(st.weeks.length>1?` (${st.weeks.length})`:'');
  $('#wkPop').innerHTML=`<div class="grid5">${W.map(w=>`<label><input type="checkbox" value="${w.i}" ${st.weeks.includes(w.i)?'checked':''}>${w.w} <span class="muted">${dmy(w.start)}</span></label>`).join('')}</div>
    <div class="acts"><button data-a="cur">Current week</button><button data-a="ptd">W44 → current</button><button data-a="all">All weeks</button><button data-a="close">Done</button></div>`;
  document.querySelectorAll('#fUnit button').forEach(b=>b.classList.toggle('on',b.dataset.u===st.unit));
  document.querySelectorAll('#tabs button').forEach(b=>{ const on=b.dataset.t===st.tab; b.classList.toggle('on',on); b.setAttribute('aria-current',on?'page':'false'); });
  document.querySelectorAll('#filters .f[data-f]').forEach(f=>{ const k=f.dataset.f; const on=k==='weeks'?!(st.weeks.length===1&&st.weeks[0]===CUR):(k==='q'?st.q.trim()!=='':st[k]!==DEF[k]); f.classList.toggle('on',on); });
  const t=geoActive()?null:totals('MT Total'); const p=t?paceOf(t):null, d=t?doneOf(t):null; const c=paceCls(d,p);
  $('#subl').innerHTML=`<span class="pace-chip" title="Pacing = Plan W44 → ${W[CUR-1].w} / Plan cả kỳ (26/10/2026 → 07/02/2027), theo bộ lọc hiện tại">⏱ Pacing ${W[CUR-1].w}: <b>${pct1(p)}</b></span>`+
    (d!=null?`<span class="gp ${c}" style="border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:650">Deli ${pct1(d)} · ${(d-p)>=0?'+':''}${((d-p)*100).toFixed(1)}pt</span>`:'')+
    `<span class="dot">•</span><span>Data <b>${dmy(DATA_DATE)}/${DATA_DATE.slice(0,4)}</b></span><span class="dot">•</span><span>Updated <b>${esc(D.updated)}</b></span><span class="dot">•</span><span>Tuần hiện tại <b>${W[CUR-1].w}</b> · Tết ${W[CUR-1].tet}</span>`;
}
function placeFilters(){ $('#filters').style.top=document.querySelector('.topbar').offsetHeight+'px'; }
function render(){ TABLES.length=0; binders.length=0; INB_CACHE=null; prepQ(); syncControls(); save();
  try{ ({overview:vOverview,sku:vSku,store:vStore,acc:vAcc,yag:vYag,inb:vInb,warn:vWarn,stock:vStock}[st.tab]||vOverview)();
    if(geoActive()&&!['store','stock'].includes(st.tab)) main.insertAdjacentHTML('afterbegin',`<div class="geo-note">📍 Đang lọc ${geoTxt()}: Plan không có theo Account 2/Tỉnh/Office nên các cột Plan, %, thanh tiến độ hiển thị “–”; Order/Deli/Cancel/Waiting đã được lọc.</div>`);
  }catch(e){ main.innerHTML=`<div class="err"><h2>Something went wrong</h2><pre>${esc(e.stack||e)}</pre></div>`; console.error(e); }
  binders.forEach(f=>f()); bindSort(); placeFilters(); if(st.tab==='inb') fitInb(); }
const on=(id,ev,fn)=>$(id).addEventListener(ev,fn);
[['#fKam','kam'],['#fCh','ch'],['#fAcc','acc'],['#fA2','a2'],['#fSg','sg'],['#fOff','office'],['#fProv','prov'],['#fWh','wh'],['#fBrand','brand'],['#fStatus','status']].forEach(([id,k])=>on(id,'change',e=>{ st[k]=e.target.value; st.dz=null; render(); }));
let qt; on('#fQ','input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{st.q=e.target.value;render();},250); });
document.querySelectorAll('#fUnit button').forEach(b=>b.onclick=()=>{st.unit=b.dataset.u;render();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;render();window.scrollTo(0,0);});
on('#wkBtn','click',e=>{ const p=$('#wkPop'); p.style.display=p.style.display==='block'?'none':'block'; e.stopPropagation(); });
on('#wkPop','click',e=>{ e.stopPropagation(); const a=e.target.dataset&&e.target.dataset.a; const cur=CUR;
  if(a==='cur') st.weeks=[cur]; else if(a==='ptd') st.weeks=W.filter(w=>w.i<=cur).map(w=>w.i); else if(a==='all') st.weeks=W.map(w=>w.i); else if(a==='close'){ $('#wkPop').style.display='none'; return; }
  else if(e.target.type==='checkbox'){ const v=+e.target.value; st.weeks=e.target.checked?[...new Set([...st.weeks,v])]:st.weeks.filter(x=>x!==v); if(!st.weeks.length) st.weeks=[v]; }
  else return; render(); $('#wkPop').style.display='block'; });
document.addEventListener('click',()=>{ $('#wkPop').style.display='none'; });
on('#resetBtn','click',()=>{ Object.assign(st,DEF,{weeks:[CUR],sort:{},dz:null}); $('#fQ').value=''; render(); });
on('#themeBtn','click',()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; });
const strip=h=>String(h==null?'':h).replace(/<div[^>]*>/g,' · ').replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/\s+/g,' ').trim();
function cellVal(c,r){ const raw=r[c.k]; if(typeof raw==='number'&&!c.f) return raw; if(c.k==='pace'){ const d=doneOf(r), p=paceOf(r); return d==null?'':`${pct1(d)} (pacing ${pct1(p)}, ${((d-p)*100).toFixed(1)}pt)`; } const t=strip(c.f?c.f(r):raw); const n=Number(t.replace(/,/g,'')); return (t!==''&&!isNaN(n)&&!/%$/.test(t))?n:t; }
function tablesAOA(t){ return [t.cols.map(c=>c.l)].concat(t.rows.map(r=>t.cols.map(c=>cellVal(c,r)))); }
function fname(ext){ return `Tet2027_${st.tab}_${st.kam==='All'?'All':st.kam.replace(/\s+/g,'_')}_${weekLbl().replace(/[ ,]+/g,'_')}.${ext}`; }
on('#csvBtn','click',()=>{ if(!TABLES.length) return;
  const info=[['Tết 2027 MT Portal'],['Tab',st.tab],['Data date',DATA_DATE],['KAM',st.kam],['Channel',st.ch],['Account',st.acc],['Sales Group',st.sg],['Office',st.office],['Province',st.prov],['Warehouse',st.wh],['Brand',st.brand],['Status',st.status],['Weeks',weekLbl()],['Search',st.q],['Unit',uLbl()]];
  const blocks=[info]; TABLES.forEach(t=>{ blocks.push([[],['## '+t.title]]); blocks.push(tablesAOA(t)); });
  const csv='﻿'+blocks.flat().map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=fname('csv'); a.click(); });
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(render,250); });
render();
})();
</script>
