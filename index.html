<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tết 2027 MT Portal</title>
<style>
:root{
  color-scheme:light;
  --bg:#eef1f5; --surface:#ffffff; --surface-2:#f6f8fb; --line:#e2e7ee; --line-strong:#cdd5df;
  --text:#152230; --text-2:#4a5868; --text-3:#7b8898;
  --bar:#13253b; --bar-2:#1c3452; --bar-ink:#eaf1fb; --bar-mute:#9fb3cc; --accent:#3d8bfd;
  --s-plan:#a9bbd0; --s-order:#2a78d6; --s-deli:#1baf7a; --s-y26:#eb6834;
  --good:#1f7a3f; --good-bg:#e1f2e6; --warn:#8a5a00; --warn-bg:#fff0c2; --bad:#a3271f; --bad-bg:#fbe1de; --info:#245ea8; --info-bg:#e5effc;
  --c1:#2a78d6; --c2:#1baf7a; --c3:#eb6834; --c4:#8a63d2; --c5:#d1a20f; --c6:#2aa5b8; --c7:#c2457a; --c8:#7b8898;
  --shadow:0 1px 2px rgba(16,32,48,.05),0 6px 20px rgba(16,32,48,.06);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1318; --surface:#181d24; --surface-2:#1f262e; --line:#2a323c; --line-strong:#38424e;
  --text:#edf1f5; --text-2:#b3bec9; --text-3:#84909d;
  --bar:#0b1a2b; --bar-2:#13263d;
  --s-plan:#5b6e86; --s-order:#3987e5; --s-deli:#199e70; --s-y26:#d95926;
  --good:#7fd39a; --good-bg:#1b3125; --warn:#f0c868; --warn-bg:#3a2f12; --bad:#f19a92; --bad-bg:#3d1f1d; --info:#9cc3f5; --info-bg:#1b2a3e;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13.5px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:0 18px}
/* ---- top bar ---- */
.topbar{background:linear-gradient(90deg,var(--bar),var(--bar-2));color:var(--bar-ink);position:sticky;top:0;z-index:30;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.tb{display:flex;align-items:center;gap:14px;height:58px}
.mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#e2483d,#f2a03d);display:grid;place-items:center;font-weight:800;color:#fff;letter-spacing:-.04em;font-size:15px}
.brandtxt b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.01em}
.brandtxt span{font-size:11.5px;color:var(--bar-mute)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;color:var(--bar-ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip b{font-weight:650}
.sp{flex:1}
.tbtn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:var(--bar-ink);border-radius:8px;padding:7px 11px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.14)}
.tbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-top:1px solid rgba(255,255,255,.08)}
nav.tabs button{border:0;background:none;color:var(--bar-mute);padding:10px 14px;font:inherit;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--bar-ink)}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent);font-weight:600}
/* ---- filters ---- */
.filters{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:99px;z-index:25}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:10px 18px}
.f select{max-width:190px}
.f{display:flex;flex-direction:column;gap:3px;min-width:100px}
.f label{font-size:10.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
select,input[type=date],input[type=search]{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:6px 8px;min-height:32px}
input[type=search]{min-width:200px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface-2);color:var(--text-2);padding:6px 11px;font:inherit;cursor:pointer;min-height:30px}
.seg button.on{background:var(--bar-2);color:#fff}
.wkbtn{font:inherit;color:var(--text);background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;min-height:32px;cursor:pointer;min-width:170px;text-align:left}
.pop{position:absolute;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.18);padding:10px;z-index:60;display:none;width:330px}
.pop .grid5{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.pop label{display:flex;gap:6px;align-items:center;font-size:12px;padding:3px 4px;border-radius:6px;cursor:pointer}
.pop label:hover{background:var(--surface-2)}
.pop .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.pop .acts button{font:inherit;font-size:12px;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);border-radius:6px;padding:4px 8px;cursor:pointer}
.reset{font:inherit;font-size:12px;border:0;background:none;color:var(--info);cursor:pointer;padding:6px 4px}
main{padding:16px 0 48px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(175px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.kpi .lab{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .val{font-size:25px;font-weight:680;letter-spacing:-.02em;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--text-2);margin-top:1px}
.card h2{font-size:14px;margin:0 0 10px;font-weight:650;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 .hint{font-weight:400;color:var(--text-3);font-size:12px}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tw{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
@media (max-width:1000px){.two,.tw{grid-template-columns:1fr}}
.mt{margin-top:12px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin:0 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.line{height:0;width:14px;border-top:2px dashed var(--s-y26);border-radius:0;vertical-align:3px}
svg text{fill:var(--text-3);font-size:11px}
.tbl{overflow:auto;max-height:640px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
thead th{position:sticky;top:0;background:var(--surface-2);color:var(--text-2);font-weight:600;z-index:2;cursor:pointer;user-select:none}
thead tr.grp th{top:0;cursor:default;text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3)}
thead tr.grp + tr th{top:29px}
th.l,td.l{text-align:left}
th.sep,td.sep{border-left:2px solid var(--line-strong)}
td.wrap{white-space:normal;min-width:230px;max-width:380px;text-align:left;color:var(--text-2);font-size:12px}
tbody tr:hover td{background:var(--surface-2)}
tr.tot td{font-weight:700;background:var(--surface-2)}
tr.ghdr td{background:var(--info-bg);color:var(--info);font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.04em;text-align:left}
tr.sub td{color:var(--text-3)}
tr.sub td:first-child{padding-left:26px}
td.num{font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:650;white-space:nowrap;margin:1px 2px 1px 0}
.pill.ok{background:var(--good-bg);color:var(--good)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--surface-2);color:var(--text-3)} .pill.info{background:var(--info-bg);color:var(--info)}
.pct.lo{color:var(--bad);font-weight:650} .pct.hi{color:var(--warn);font-weight:650} .pct.ok{color:var(--good);font-weight:650}
.prog{display:inline-flex;align-items:center;gap:6px}
.prog .tr{width:84px;height:7px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog .tr i{display:block;height:100%;background:var(--s-deli)}
.prog .tr i.mid{background:var(--c5)} .prog .tr i.low{background:var(--bad)}
.tick{font-weight:700}
.tick.y{color:var(--good)} .tick.p{color:var(--warn)} .tick.n{color:var(--bad)}
.muted{color:var(--text-3)}
.foot{font-size:11.5px;color:var(--text-3);margin-top:8px}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:80;display:none;min-width:160px}
.tip b{display:block;margin-bottom:4px}
.tip .row{display:flex;justify-content:space-between;gap:16px}
.empty{padding:28px;text-align:center;color:var(--text-3)}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.dleg{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:12px;align-items:center;min-width:220px}
.dleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.xbtn{border:0;background:none;color:var(--info);cursor:pointer;font:inherit;padding:0 4px}
.err{max-width:640px;margin:80px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="tb">
      <div class="mark">T27</div>
      <div class="brandtxt"><b>Tết 2027 · MT Tracking Portal</b><span>Plan · Order · Deli · Stock · Coverage · Inbound</span></div>
      <div class="chips" id="chips"></div>
      <div class="sp"></div>
      <button class="tbtn primary" id="xlsBtn" title="Export the tables of this tab with the current filters">⭳ Excel</button>
      <button class="tbtn" id="csvBtn" title="Export the main table as CSV">CSV</button>
      <button class="tbtn" id="themeBtn" title="Light / dark">◐</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="overview">Overview</button>
      <button data-t="sku">SKU Checking</button>
      <button data-t="store">Store Checking</button>
      <button data-t="acc">Accounts</button>
      <button data-t="yag">YAG</button>
      <button data-t="inb">Inbound Late</button>
      <button data-t="warn">Warning</button>
    </nav>
  </div>
</header>
<section class="filters">
  <div class="wrap fr">
    <div class="f"><label for="fKam">KAM</label><select id="fKam"></select></div>
    <div class="f"><label for="fCh">Channel</label><select id="fCh"></select></div>
    <div class="f"><label for="fAcc">Account</label><select id="fAcc"></select></div>
    <div class="f"><label for="fSg">Sales Group</label><select id="fSg"></select></div>
    <div class="f"><label for="fWh">Warehouse</label><select id="fWh"></select></div>
    <div class="f"><label for="fBrand">Brand</label><select id="fBrand"></select></div>
    <div class="f" style="position:relative"><label>Weeks</label><button class="wkbtn" id="wkBtn"></button><div class="pop" id="wkPop"></div></div>
    <div class="f"><label for="fStatus">Status</label><select id="fStatus"></select></div>
    <div class="f"><label for="fQ">Search SKU / Store</label><input type="search" id="fQ" placeholder="Code, SKU name or store name…"></div>
    <div class="f"><label>Unit</label><div class="seg" id="fUnit"><button data-u="Box">Box</button><button data-u="Amount">M VND</button></div></div>
    <button class="reset" id="resetBtn">Reset filters</button>
  </div>
</section>
<main class="wrap" id="main"></main>
<div class="tip" id="tip"></div>
<script>document.write('<script src="Tet_Portal_Data.js?v='+Date.now()+'"><\/script>');</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
const D = window.TET_DATA;
const $ = s => document.querySelector(s);
const main = $('#main');
if(!D){ main.innerHTML='<div class="err"><h2>Data file not found</h2><p>Keep <code>Tet_Portal_Data.js</code> next to this page (written by <b>Update Data</b> in the Excel file).</p></div>'; return; }
// ================= DATA =================
const W = D.weeks.map((w,i)=>({i:i+1,w:w[0],tet:w[1],start:w[2],m:w[3]}));
const SKU = {}; D.skus.forEach(s=>SKU[s[0]]={code:s[0],brand:s[1],name:s[2],price:s[3]});
const SKU_ORDER = D.skus.map(s=>s[0]);
const BR = (D.brands&&D.brands.length? D.brands : [...new Set(D.skus.map(s=>s[1]))].map(b=>[b,'',''])).map(b=>({b:b[0],cat:b[1],sub:b[2]}));
const BR_IDX = {}; BR.forEach((b,i)=>BR_IDX[b.b]=i);
const brandOf = c => (SKU[c]||{}).brand || '(Other)';
const ACC = D.accounts.map((a,i)=>({acc:a[0],kam:a[1],ch:a[2]||'',i}));
const ACC_IDX = {}, CH_OF = {}; ACC.forEach(a=>{ACC_IDX[a.acc]=a.i; CH_OF[a.acc]=a.ch;});
const CHANNELS = [...new Set(ACC.map(a=>a.ch).filter(Boolean))];
const chOf = acc => CH_OF[acc] || 'Other';
const accIdx = acc => (acc in ACC_IDX)? ACC_IDX[acc] : 999;
const P = D.plan.map(r=>{ const o={wh:r[0],whs:r[1],area:r[2],acc:r[3],kam:r[4],sku:r[5],wi:r[6],mi:r[7],box:r[8],amt:r[9]}; o.sg = o.acc==='ECOM'?'KAM Part':(o.area==='North'?'MT North Center':(o.area==='South'?'MT South Center':'')); return o; });
const A = D.act.map(r=>({wh:r[0],whs:r[1],area:r[2],acc:r[3],kam:r[4],sku:r[5],wi:r[6],mi:r[7],date:r[8],ob:r[9],oa:r[10],db:r[11],da:r[12],store:r[13]||'',sg:r[14]||'',bill:r[15]||'',office:r[16]||''}));
const S = D.stock.map(r=>({wh:r[0],sku:r[1],q:r[2],a:r[3]}));
const Y = D.y26.map(r=>({area:r[0],acc:r[1],kam:r[2],sku:r[3],wi:r[4],box:r[5],amt:r[6]}));
const STORES = (D.stores||[]).map(r=>({code:r[0],name:r[1],acc:r[2],sg:r[3]||'',office:r[4]||'',dc:r[5]===1,parent:r[6]||'',prov:r[7]||''}));
const STORE_BY = {}; STORES.forEach(s=>STORE_BY[s.code]=s);
const INB = (D.inbound||[]).map(r=>({center:r[0],account:r[1],acc:r[2],kam:r[3],sku:r[4],name:r[5],dates:r[6]}));
const KAMS = [...new Set(ACC.map(a=>a.kam).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));
const SGS = ['MT North Center','MT South Center','KAM Part'];
const WHS = ['MT Total','YP','MP','DN','DN North','DN South'];
const DATA_DATE = D.dataDate;
// ================= STATE =================
const st = {kam:'All',ch:'All',acc:'All',sg:'All',wh:'MT Total',brand:'All',status:'All',q:'',unit:'Box',weeks:[D.curWeek||1],tab:'overview',sort:{},open:{}};
try{ const s=JSON.parse(localStorage.getItem('tetPortal3')||'{}'); ['kam','tab','unit'].forEach(k=>{ if(s[k]) st[k]=s[k]; }); }catch(e){}
const save=()=>{ try{ localStorage.setItem('tetPortal3',JSON.stringify({kam:st.kam,tab:st.tab,unit:st.unit})); }catch(e){} };
const wkSet = () => new Set(st.weeks);
const wkMax = () => Math.max(...st.weeks);
// ================= FORMAT =================
const nf0=new Intl.NumberFormat('en-US',{maximumFractionDigits:0}), nf1=new Intl.NumberFormat('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const V=(b,a)=> st.unit==='Box'? b : a/1e6;
const fmt=v=>(v==null||isNaN(v)||Math.abs(v)<0.05)?'–':(st.unit==='Box'?nf0.format(v):nf1.format(v));
const sgn=v=>(v>0?'+':'')+fmt(v);
const pct=v=>(v==null||!isFinite(v))?'–':Math.round(v*100)+'%';
const pcls=v=>(v==null||!isFinite(v))?'':(v<0.9?'lo':(v>1.1?'hi':''));
const ccls=v=>(v==null||!isFinite(v))?'':(v<0.5?'lo':(v<0.8?'hi':'ok'));
const hit=(p,d)=> p>0? Math.max(0,1-Math.abs(d-p)/p) : null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uLbl=()=>st.unit==='Box'?'Box':'M VND';
const dmy=s=>s?s.slice(8,10)+'/'+s.slice(5,7):'';
const prog=(v,lbl)=>{ if(v==null||!isFinite(v)) return '<span class="muted">–</span>'; const c=v>=0.8?'':(v>=0.5?'mid':'low'); return `<span class="prog"><span class="tr"><i class="${c}" style="width:${Math.min(100,v*100)}%"></i></span><span class="pct ${ccls(v)}">${lbl||pct(v)}</span></span>`; };
// ================= FILTERS =================
const qx = () => st.q.trim().toLowerCase();
let QSKU=null, QSTORE=null;
function prepQ(){ const q=qx(); if(!q){QSKU=null;QSTORE=null;return;}
  QSKU=new Set(D.skus.filter(s=>s[0].toLowerCase().includes(q)||String(s[2]).toLowerCase().includes(q)).map(s=>s[0]));
  QSTORE=new Set(STORES.filter(s=>s.code.includes(q)||s.name.toLowerCase().includes(q)).map(s=>s.code));
  if(!QSKU.size) QSKU=null; if(!QSTORE.size) QSTORE=null; if(!QSKU&&!QSTORE){QSKU=new Set();} }
const kamOk=r=>st.kam==='All'||r.kam===st.kam;
const accOk=r=>st.acc==='All'||r.acc===st.acc;
const chOk=r=>st.ch==='All'||chOf(r.acc)===st.ch;
const brOk=sku=>st.brand==='All'||brandOf(sku)===st.brand;
const skuQ=sku=>!QSKU||QSKU.has(sku);
const sgActive=()=>st.sg!=='All';
function pBlocks(r){ const b=[]; const sga=sgActive();
  if(r.wh){ if(r.wh==='DN'){ if(!sga){b.push('DN','MT Total');} } else b.push(r.wh,'MT Total'); }
  if(r.whs){ b.push(r.whs); if(sga) b.push('DN','MT Total'); }
  return b; }
function aBlocks(r){ const b=[]; if(r.wh==='YP'||r.wh==='MP'||r.wh==='DN') b.push(r.wh,'MT Total'); if(r.whs) b.push(r.whs); return b; }
const pBase=r=>kamOk(r)&&accOk(r)&&chOk(r)&&brOk(r.sku)&&(!sgActive()||r.sg===st.sg)&&(QSKU||!QSTORE?skuQ(r.sku):true);
const aBase=r=>kamOk(r)&&accOk(r)&&chOk(r)&&brOk(r.sku)&&(!sgActive()||r.sg===st.sg)&&(QSKU&&!QSTORE?skuQ(r.sku):(QSTORE&&!QSKU?QSTORE.has(r.store):(QSKU&&QSTORE?(skuQ(r.sku)||QSTORE.has(r.store)):true)));
const inWh=(blocks,wh)=>blocks.includes(wh||st.wh);
function fP(wh){ return P.filter(r=>pBase(r)&&inWh(pBlocks(r),wh)); }
function fA(wh){ return A.filter(r=>aBase(r)&&inWh(aBlocks(r),wh)); }
function stockOf(sku,wh){ wh=wh||st.wh; const whs=wh==='MT Total'?['YP','MP','DN']:(wh.startsWith('DN')?['DN']:[wh]); let s=0; S.forEach(r=>{ if(r.sku===sku&&whs.includes(r.wh)) s+=st.unit==='Box'?r.q:r.a/1e6; }); return s; }
// ---- core aggregation: by key fn ----
function agg(keyP,keyA,wh){ const ws=wkSet(), mx=wkMax(), m={};
  const g=k=>m[k]=m[k]||{wP:0,wO:0,wD:0,cP:0,cO:0,cD:0,sP:0,accm:{}};
  fP(wh).forEach(r=>{ const k=keyP(r); if(k==null) return; const o=g(k), v=V(r.box,r.amt); o.sP+=v; if(ws.has(r.wi)) o.wP+=v; if(r.wi>=1&&r.wi<=mx){ o.cP+=v; (o.accm[r.acc]=o.accm[r.acc]||[0,0])[0]+=v; } });
  fA(wh).forEach(r=>{ const k=keyA(r); if(k==null) return; const o=g(k), ov=V(r.ob,r.oa), dv=V(r.db,r.da); if(ws.has(r.wi)){o.wO+=ov;o.wD+=dv;} if(r.wi>=1&&r.wi<=mx){ o.cO+=ov;o.cD+=dv; (o.accm[r.acc]=o.accm[r.acc]||[0,0])[1]+=ov; } });
  return m; }

     Object.values(late.reduce((m,r)=>{ const o=m[r.account]=m[r.account]||{a:r.account,acc:r.acc,ch:r.ch,n:0,no:0,or:0}; o.n++; if(r.noOrd) o.no++; else o.or++; return m; },{})).sort((a,b)=>accIdx(a.acc)-accIdx(b.acc)),{title:'Late by account'})}</div></div>
   <div class="card mt"><h2>Planned but not delivered<span class="hint">Order = any order since the previous planned date · Deli = billing since the previous planned date · store counts = season to date</span></h2>
   ${table('inb',[{k:'account',l:'Account',cls:'l',sort:r=>accIdx(r.acc)},{k:'kam',l:'KAM',cls:'l'},{k:'sku',l:'SKU',cls:'l',f:r=>`<b>${esc(r.sku)}</b><div class="muted" style="font-size:11px">${esc(r.brand)} · ${esc(r.name)}</div>`},
     {k:'firstLate',l:'Planned',cls:'l',f:r=>dmy(r.firstLate)},{k:'days',l:'Days late',f:r=>`<span class="pill ${r.days>7?'bad':'warn'}">${r.days}</span>`},
     {k:'nOrd',l:'Order (stores)',sep:true,f:r=>tick(r.nOrdN+r.nOrdS,true)+(r.noOrd?' <span class="pill bad">no order</span>':''),sort:r=>r.nOrdN+r.nOrdS},{k:'nDel',l:'Deli (stores)',f:r=>tick(r.nDelN+r.nDelS,true),sort:r=>r.nDelN+r.nDelS},
     {k:'pr',l:'Delivered / due',f:r=>prog(r.pr,`${r.done}/${r.due}`),sort:r=>r.pr},{k:'note',l:'Note',cls:'wrap'}],out,{title:'Inbound late',maxh:720})}</div>`;
}
function vWarn(){ const ws=wkSet(), mx=wkMax(); const tol=0.5;
  const d1=[], d2=[]; ['YP','MP','DN'].forEach(wh=>{ const m=agg(r=>r.sku,r=>r.sku,wh); Object.entries(m).forEach(([c,o])=>{ const s=stockOf(c,wh);
      if(o.wP>0&&o.wD+s<o.wP) d1.push({wh,code:c,name:(SKU[c]||{}).name||'',p:o.wP,d:o.wD,s,sh:o.wP-o.wD-s});
      if(o.cO>o.cP) d2.push({wh,code:c,name:(SKU[c]||{}).name||'',p:o.cP,o:o.cO,d:o.cD,s,gap:o.cO-o.cP,flag:o.cD+s<o.cO?'Warning Loss':'Over Plan'}); }); });
  d1.sort((a,b)=>b.sh-a.sh); d2.sort((a,b)=>(a.flag===b.flag?0:(a.flag==='Warning Loss'?-1:1))||b.gap-a.gap);
  const aw=[]; ['YP','MP','DN'].forEach(wh=>{ const m=agg(r=>r.acc,r=>r.acc,wh); Object.entries(m).forEach(([a,o])=>{ if(a) aw.push({acc:a,wh,kam:(ACC.find(x=>x.acc===a)||{}).kam||'',p:o.cP,o:o.cO,gap:o.cO-o.cP}); }); });
  const over=aw.filter(r=>r.gap>=tol).sort((a,b)=>b.gap-a.gap).slice(0,20), under=aw.filter(r=>r.gap<=-tol).sort((a,b)=>a.gap-b.gap).slice(0,20);
  const nm=r=>`<b>${esc(r.code)}</b><div class="muted" style="font-size:11px">${esc(r.name)}</div>`;
  main.innerHTML=`<div class="grid two"><div class="card"><h2>Stock risk – selected weeks<span class="hint">Deli + Stock &lt; Plan · ${weekLbl()}</span></h2>${table('w1',[{k:'wh',l:'WH',cls:'l'},{k:'code',l:'SKU',cls:'l',f:nm},cN('p','Plan'),cN('d','Deli'),cN('s','Stock'),{k:'sh',l:'Shortfall',f:r=>`<b class="pct lo">${fmt(r.sh)}</b>`}],d1,{title:'Stock risk'})}</div>
   <div class="card"><h2>Warning Loss / Over Plan – PTD<span class="hint">Order &gt; Plan; Warning Loss when Deli + Stock &lt; Order</span></h2>${table('w2',[{k:'wh',l:'WH',cls:'l'},{k:'code',l:'SKU',cls:'l',f:nm},cN('p','Plan'),cN('o','Order'),cN('d','Deli'),cN('s','Stock'),{k:'gap',l:'Gap',f:r=>sgn(r.gap)},{k:'flag',l:'Flag',cls:'l',f:r=>`<span class="pill ${r.flag==='Warning Loss'?'bad':'warn'}">${r.flag}</span>`}],d2,{title:'Warning Loss'})}</div></div>
   <div class="grid two mt"><div class="card"><h2>Top 20 account / WH over plan – PTD</h2>${table('w3',[{k:'acc',l:'Account',cls:'l'},{k:'wh',l:'WH',cls:'l'},{k:'kam',l:'KAM',cls:'l'},cN('p','Plan'),cN('o','Order'),{k:'gap',l:'Gap',f:r=>`<span class="pct hi">${sgn(r.gap)}</span>`},cP('po','%Order',r=>r.o/r.p)],over,{title:'Top over'})}</div>
   <div class="card"><h2>Top 20 account / WH under plan – PTD</h2>${table('w4',[{k:'acc',l:'Account',cls:'l'},{k:'wh',l:'WH',cls:'l'},{k:'kam',l:'KAM',cls:'l'},cN('p','Plan'),cN('o','Order'),{k:'gap',l:'Gap',f:r=>`<span class="pct lo">${sgn(r.gap)}</span>`},cP('po','%Order',r=>r.o/r.p)],under,{title:'Top under'})}</div></div>`;
}
// ================= CONTROLS =================
function fill(el,opts,cur){ el.innerHTML=opts.map(o=>{ const v=Array.isArray(o)?o[0]:o, l=Array.isArray(o)?o[1]:o; return `<option value="${esc(v)}"${String(v)===String(cur)?' selected':''}>${esc(l)}</option>`; }).join(''); }
function syncControls(){
  fill($('#fKam'),['All',...KAMS],st.kam); fill($('#fCh'),['All',...CHANNELS],st.ch);
  const accs=ACC.filter(a=>(st.kam==='All'||a.kam===st.kam)&&(st.ch==='All'||a.ch===st.ch)).map(a=>a.acc); if(st.acc!=='All'&&!accs.includes(st.acc)) st.acc='All';
  fill($('#fAcc'),['All',...accs],st.acc); fill($('#fSg'),['All',...SGS],st.sg); fill($('#fWh'),WHS,st.wh); fill($('#fBrand'),['All',...BR.map(b=>b.b)],st.brand);
  fill($('#fStatus'),['All','Over Plan','Warning Loss','Low Stock','Late Inbound'],st.status);
  $('#wkBtn').textContent='▦ '+weekLbl()+(st.weeks.length>1?` (${st.weeks.length})`:'');
  $('#wkPop').innerHTML=`<div class="grid5">${W.map(w=>`<label><input type="checkbox" value="${w.i}" ${st.weeks.includes(w.i)?'checked':''}>${w.w} <span class="muted">${dmy(w.start)}</span></label>`).join('')}</div>
    <div class="acts"><button data-a="cur">Current week</button><button data-a="ptd">W44 → current</button><button data-a="all">All weeks</button><button data-a="close">Done</button></div>`;
  document.querySelectorAll('#fUnit button').forEach(b=>b.classList.toggle('on',b.dataset.u===st.unit));
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.tab));
  $('#chips').innerHTML=`<span class="chip">Data <b>${dmy(DATA_DATE)}/${DATA_DATE.slice(0,4)}</b></span><span class="chip">Updated <b>${esc(D.updated)}</b></span><span class="chip">Current <b>${W[(D.curWeek||1)-1].w}</b> · Tết ${W[(D.curWeek||1)-1].tet}</span>`;
}
function render(){ TABLES.length=0; binders.length=0; INB_CACHE=null; prepQ(); syncControls(); save();
  try{ ({overview:vOverview,sku:vSku,store:vStore,acc:vAcc,yag:vYag,inb:vInb,warn:vWarn}[st.tab]||vOverview)(); }catch(e){ main.innerHTML=`<div class="err"><h2>Something went wrong</h2><pre>${esc(e.stack||e)}</pre></div>`; console.error(e); }
  binders.forEach(f=>f()); bindSort(); }
const on=(id,ev,fn)=>$(id).addEventListener(ev,fn);
on('#fKam','change',e=>{st.kam=e.target.value;render();}); on('#fCh','change',e=>{st.ch=e.target.value;render();}); on('#fAcc','change',e=>{st.acc=e.target.value;render();});
on('#fSg','change',e=>{st.sg=e.target.value;render();}); on('#fWh','change',e=>{st.wh=e.target.value;render();}); on('#fBrand','change',e=>{st.brand=e.target.value;render();});
on('#fStatus','change',e=>{st.status=e.target.value;render();});
let qt; on('#fQ','input',e=>{ clearTimeout(qt); qt=setTimeout(()=>{st.q=e.target.value;render();},250); });
document.querySelectorAll('#fUnit button').forEach(b=>b.onclick=()=>{st.unit=b.dataset.u;render();});
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;render();window.scrollTo(0,0);});
on('#wkBtn','click',e=>{ const p=$('#wkPop'); p.style.display=p.style.display==='block'?'none':'block'; e.stopPropagation(); });
on('#wkPop','click',e=>{ e.stopPropagation(); const a=e.target.dataset&&e.target.dataset.a; const cur=D.curWeek||1;
  if(a==='cur') st.weeks=[cur]; else if(a==='ptd') st.weeks=W.filter(w=>w.i<=cur).map(w=>w.i); else if(a==='all') st.weeks=W.map(w=>w.i); else if(a==='close'){ $('#wkPop').style.display='none'; return; }
  else if(e.target.type==='checkbox'){ const v=+e.target.value; st.weeks=e.target.checked?[...new Set([...st.weeks,v])]:st.weeks.filter(x=>x!==v); if(!st.weeks.length) st.weeks=[v]; }
  else return; render(); $('#wkPop').style.display='block'; });
document.addEventListener('click',()=>{ $('#wkPop').style.display='none'; });
on('#resetBtn','click',()=>{ Object.assign(st,{kam:'All',ch:'All',acc:'All',sg:'All',wh:'MT Total',brand:'All',status:'All',q:'',weeks:[D.curWeek||1],sort:{}}); $('#fQ').value=''; render(); });
on('#themeBtn','click',()=>{ const r=document.documentElement; r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'; });
const strip=h=>String(h==null?'':h).replace(/<div[^>]*>/g,' · ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();
function cellVal(c,r){ if(c.sort&&!c.f) return r[c.k]; const raw=r[c.k]; if(typeof raw==='number'&&!c.f) return raw; if(c.k&&typeof raw==='number'&&c.f&&/^(cN)/.test('')) return raw; const t=strip(c.f?c.f(r):raw); const n=Number(t.replace(/,/g,'')); return (t!==''&&!isNaN(n)&&!/%$/.test(t))?n:t; }
function tablesAOA(t){ return [t.cols.map(c=>c.l)].concat(t.rows.map(r=>t.cols.map(c=>cellVal(c,r)))); }
function fname(ext){ return `Tet2027_${st.tab}_${st.kam==='All'?'All':st.kam.replace(/\s+/g,'_')}_${weekLbl().replace(/[ ,]+/g,'_')}.${ext}`; }
on('#xlsBtn','click',()=>{ if(!window.XLSX){ alert('Excel export library could not load (offline?). Use CSV.'); return; } const wb=XLSX.utils.book_new();
  const info=[['Tết 2027 MT Portal export'],['Data date',DATA_DATE],['KAM',st.kam],['Channel',st.ch],['Account',st.acc],['Sales Group',st.sg],['Warehouse',st.wh],['Brand',st.brand],['Status',st.status],['Weeks',weekLbl()],['Search',st.q],['Unit',uLbl()]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(info),'Filters');
  const used={}; TABLES.forEach(t=>{ let n=String(t.title).replace(/[\\/?*\[\]:]/g,'').slice(0,28)||'Table'; while(used[n]) n+='_'; used[n]=1; XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(tablesAOA(t)),n); });
  XLSX.writeFile(wb,fname('xlsx')); });
on('#csvBtn','click',()=>{ const t=TABLES[TABLES.length-1]; if(!t) return; const csv='﻿'+tablesAOA(t).map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download=fname('csv'); a.click(); });
let rt; addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(render,250); });
render();
})();
</script>
